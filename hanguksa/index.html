<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="한능검 1급"><title>한능검 1급 모바일 학습팩</title><style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#172a31;--mut:#66757b;--g:#17675d;--gb:#e9f4ef;--red:#a23a32;--rb:#fff0ed;--line:#dce2dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.65;padding-bottom:84px}button{font:inherit;touch-action:manipulation}.wrap{max-width:760px;margin:auto;padding:16px}.head{padding:12px 0 18px}.head b{font-size:1.3rem}.head p{margin:4px 0;color:var(--mut);font-size:.9rem}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:#fff;color:var(--mut);padding:10px 2px;font-size:.76rem;font-weight:750;min-height:52px}.nav button.on{color:var(--g);background:var(--gb);border-radius:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}.tag{display:inline-block;background:var(--gb);color:var(--g);border-radius:8px;padding:3px 8px;font-size:.76rem;font-weight:800}.mut{color:var(--mut)}h1,h2,h3,p{margin-top:0}h2{font-size:1.25rem}.q{font-size:1.08rem;font-weight:750;white-space:pre-line;margin:16px 0}.opts{display:grid;gap:9px}.opt{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:14px;min-height:52px;color:var(--ink)}.opt.sel{border-color:var(--g);background:var(--gb)}.opt.ok{border-color:var(--g);background:var(--gb)}.opt.bad{border-color:var(--red);background:var(--rb)}.actions{display:flex;gap:8px;margin-top:15px}.actions button,.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:750;min-height:46px}.actions button{flex:1}.primary{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}.feedback{margin-top:16px;padding:15px;border-radius:
