<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="한능검 1급">
<title>한능검 1급 · 기출 흐름 100문제</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#172525;--mut:#687776;--line:#dbe3df;--green:#0d6b5c;--green2:#e7f4ef;--blue:#315faa;--red:#b4483e;--red2:#fff0ee;--amber:#9b6500;--amber2:#fff7df;--shadow:0 10px 30px rgba(23,45,40,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;line-height:1.62;padding-bottom:86px}button{font:inherit;color:inherit;touch-action:manipulation}button:disabled{opacity:.42}.shell{max-width:850px;margin:auto;padding:0 14px 32px}.hero{padding:23px 5px 16px}.hero .eyebrow{font-size:.77rem;color:var(--green);font-weight:850;letter-spacing:.04em}.hero h1{font-size:1.55rem;margin:3px 0 4px;letter-spacing:-.045em}.hero p{margin:0;color:var(--mut);font-size:.91rem}.topnote{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.topnote span{font-size:.74rem;background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:999px}
.pagehead{margin:8px 0 14px}.pagehead h2{font-size:1.42rem;margin:0;letter-spacing:-.035em}.pagehead p{margin:4px 0 0;color:var(--mut);font-size:.9rem}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;min-height:55px;border-radius:13px;font-size:.72rem;font-weight:800;color:#788482}.nav button.active{background:var(--green2);color:var(--green)}
.statrow,.bigscore{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.statrow div,.bigscore div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.statrow b,.bigscore b{font-size:1.28rem;display:block}.statrow span,.bigscore span{font-size:.72rem;color:var(--mut)}
.setbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.setbar button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 8px;font-weight:800}.setbar button.on{background:var(--green);color:#fff;border-color:var(--green)}
.quizcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.qtop{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;background:var(--green);color:#fff;font-size:.72rem;font-weight:850}.badge.soft{background:#f0f3f1;color:#5d6967}.bar{height:7px;background:#edf1ee;border-radius:10px;overflow:hidden;margin:13px 0 18px}.bar i{display:block;height:100%;background:var(--green);border-radius:10px}.qtext{font-size:1.08rem;white-space:pre-line;margin:0 0 17px;letter-spacing:-.02em}.options{display:grid;gap:9px}.option{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1.4px solid var(--line);border-radius:13px;padding:13px}.option>b{flex:0 0 27px;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eef2ef;font-size:.78rem}.option.selected{border:2px solid var(--green);background:var(--green2);padding:12.4px}.option.correct{border-color:#6bb29c;background:#eaf8f1}.option.wrong{border-color:#d68a83;background:var(--red2)}.explain{margin-top:16px;border-radius:14px;padding:15px;border:1px solid}.explain.good{background:#f0faf6;border-color:#b9dfd1}.explain.bad{background:#fff5f3;border-color:#edc8c3}.result{font-weight:900;margin-bottom:7px}.explain p{margin:4px 0 12px;font-size:.92rem}.hintbox,.trapbox{display:grid;gap:2px;border-radius:11px;padding:11px 12px;margin-top:8px;font-size:.85rem}.hintbox{background:#f2f6ff}.trapbox{background:var(--amber2)}.hintbox span,.trapbox span{color:#4d5b59}.linkbtn{margin-top:10px;border:0;background:transparent;color:var(--green);padding:5px 0;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.actions button,.primary,.smallbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:850}.actions .primary,.primary{background:var(--green);border-color:var(--green);color:#fff}
.numwrap{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.numwrap summary{font-weight:850;cursor:pointer}.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}.nums button{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:.72rem}.nums button.cur{border:2px solid var(--green)}.nums button.ok{background:#e7f5ef}.nums button.no{background:#fff0ee}.source-note{font-size:.76rem;color:var(--mut);padding:12px 4px 3px}
.chips{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:.81rem}.chip.on{background:var(--green);color:#fff;border-color:var(--green)}.summary-tip{display:grid;gap:2px;background:#ebf5f1;border:1px solid #cce2d9;border-radius:14px;padding:12px 14px;margin-bottom:12px}.summary-tip span{font-size:.82rem;color:#50605d}.summarygrid{display:grid;gap:10px}.sumcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.sumcard>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:15px}.sumcard>summary::-webkit-details-marker{display:none}.sumcard h3{margin:3px 0 4px;font-size:1.03rem}.sumcard summary p{margin:0;color:#566764;font-size:.86rem}.era-label{color:var(--green);font-size:.7rem;font-weight:900}.openmark{font-size:1.35rem;color:#80908c}.sumbody{padding:0 15px 15px;border-top:1px solid #eef1ef}.sectionlabel{font-size:.75rem;font-weight:900;color:var(--green);margin-top:13px}.sumbody ul{margin:7px 0 12px;padding-left:19px}.sumbody li{margin:5px 0;font-size:.89rem}.compare,.warning{display:grid;gap:3px;border-radius:10px;padding:10px 11px;margin:8px 0;font-size:.83rem}.compare{background:#edf4ff}.warning{background:#fff5db}.compare span,.warning span{color:#4d5b59}.related{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:12px}.related>span{font-size:.75rem;font-weight:900;color:var(--mut);margin-right:3px}.related button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 7px;font-size:.75rem;color:var(--green);font-weight:850}
.timeline{position:relative;padding-left:20px}.timeline:before{content:"";position:absolute;left:6px;top:7px;bottom:7px;width:2px;background:#cfdad5}.timeitem{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:8px;display:grid;grid-template-columns:90px 1fr;gap:10px}.timeitem:before{content:"";position:absolute;left:-20px;top:19px;width:11px;height:11px;border-radius:50%;background:var(--green);border:3px solid var(--bg)}.year{font-weight:900;color:var(--green)}.event{font-size:.88rem}
.wronghead{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.smallbtn{padding:8px 10px!important;font-size:.78rem}.wronglist{display:grid;gap:8px}.wrongitem{display:grid;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.wrongitem span{color:var(--red);font-size:.74rem;font-weight:850}.wrongitem b{font-size:.9rem}.wrongitem small{color:var(--mut)}
.analytics{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.arow{display:grid;grid-template-columns:105px 1fr 42px;gap:9px;align-items:center;margin:13px 0}.arow>div:first-child{display:grid}.arow b{font-size:.83rem}.arow span{font-size:.68rem;color:var(--mut)}.abar{height:8px!important;background:#edf1ee;border-radius:10px;overflow:hidden}.abar i{display:block;height:100%;background:var(--green)}.arow strong{font-size:.8rem;text-align:right}.resetbox{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.resetbox p{margin:0 0 8px;color:var(--mut);font-size:.82rem}.resetbox button{border:1px solid #e4c1bd;color:var(--red);background:#fff;border-radius:10px;padding:8px 10px}.fatal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
@media(min-width:720px){body{padding-bottom:30px}.shell{padding:0 22px 40px}.hero{padding-top:30px}.nav{position:sticky;top:0;bottom:auto;max-width:850px;margin:auto;border:1px solid var(--line);border-radius:16px;padding:5px;background:#fff}.nav button{min-height:44px}.summarygrid{grid-template-columns:1fr 1fr}.sumcard{align-self:start}.quizcard{padding:24px}.qtext{font-size:1.14rem}.nums button{height:38px}}
</style>
</head>
<body>
<div class="shell">
<header class="hero"><div class="eyebrow">KOREAN HISTORY · LEVEL 1</div><h1>한능검 1급 모바일 학습팩</h1><p>기출 흐름 100문제 · 핵심 요약 · 시대 연표 · 오답 자동 저장</p><div class="topnote"><span>2급 보유자용</span><span>5지선다 실전형</span><span>iPhone · Android · PC</span></div></header>
<main id="app"><div class="fatal"><b>학습팩을 불러오는 중입니다.</b></div></main>
</div>
<nav class="nav">
<button data-nav="quiz" class="active">문제 100</button>
<button data-nav="summary">핵심 요약</button>
<button data-nav="timeline">시대 순서</button>
<button data-nav="wrong">오답 노트</button>
<button data-nav="analytics">학습 통계</button>
</nav>
<script>window.addEventListener("error",e=>{const x=document.getElementById("app");if(x)x.innerHTML='<div class="fatal"><h2>로딩 오류</h2><p>'+String(e.message||"알 수 없는 오류")+'</p><p>페이지를 새로고침해 주세요.</p></div>'});</script>

</html>
