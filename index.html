*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;line-height:1.58}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}.muted{color:var(--muted)}.small{font-size:.88rem}.hidden{display:none!important}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#f8faff;border-radius:999px;padding:4px 9px;font-size:.78rem;font-weight:700}.badge.ok{color:var(--ok);background:#eaf8f2;border-color:#bfe8d7}.badge.bad{color:var(--bad);background:#fff0f1;border-color:#f0c7ca}.badge.warn{color:var(--warn);background:#fff8df;border-color:#efdca0}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 14px;font-weight:750;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(20,40,90,.08)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad);border-color:#ecc0c4}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel-pad{padding:22px}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.section-head h2{margin:0;font-size:1.45rem}.section-head p{margin:.25rem 0 0;color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{padding:18px}.stat .num{font-size:1.8rem;font-weight:850;letter-spacing:-.04em}.stat .label{color:var(--muted);font-size:.88rem}.progress{height:9px;background:#e8edf6;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:99px}.domain-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.domain-card{padding:18px}.domain-card h3{margin:5px 0}.domain-card p{color:var(--muted);font-size:.9rem;min-height:44px}.domain-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}.filters input,.filters select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;min-height:42px}.filters input{min-width:240px;flex:1}.question-card{padding:24px}.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.q-stem{font-size:1.08rem;font-weight:700}.q-stem p{margin:.6rem 0}.options{display:grid;gap:10px;margin:18px 0}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;color:var(--text);display:flex;gap:11px;align-items:flex-start}.option:hover{border-color:#9eb0ed;background:#f9fbff}.option.selected{border:2px solid var(--accent);background:var(--accent2);padding:12px 14px}.option.correct{border-color:#60b995;background:#ebfaf3}.option.wrong{border-color:#dc7a81;background:#fff0f1}.opt-no{display:grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:#eef1f7;font-size:.8rem;font-weight:800}.feedback{border-radius:14px;padding:16px;margin-top:14px;border:1px solid}.feedback.ok{background:#ecfaf4;border-color:#bfe7d6}.feedback.bad{background:#fff1f2;border-color:#efc8cb}.feedback h4{margin:0 0 7px}.feedback p{margin:.35rem 0}.q-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:15px}.q-actions .group{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px}.table-caption{font-size:.83rem;font-weight:800;color:var(--muted);margin-top:10px}table{border-collapse:collapse;width:100%;min-width:420px;background:#fff}th,td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:center;font-size:.9rem}th{background:#f5f7fb}.doc,.quote,.dialogue,.multi,.case,.data,.order{background:#f7f9fd;border-left:4px solid #9ab0ee;padding:12px 14px;border-radius:8px;margin:12px 0}.theory-list{display:grid;gap:12px}.theory-card{border:1px solid var(--line);border-radius:15px;background:#fff;overflow:hidden}.theory-card summary{cursor:pointer;padding:16px 18px;font-weight:820;display:flex;justify-content:space-between;gap:12px}.theory-card .body{padding:0 18px 18px}.theory-card ul{margin:.4rem 0;padding-left:1.2rem}.theory-card.done{border-color:#9fd8c2}.mock-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.mock-card{padding:18px}.mock-card h3{margin:0}.mock-card .score{font-size:1.4rem;font-weight:850;margin:8px 0}.mock-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:#172033;color:#fff;border-radius:13px;margin-bottom:14px;position:sticky;top:0;z-index:5}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.15rem}.num-nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:15px}.num-nav button{width:34px;height:34px;padding:0;border:1px solid var(--line);background:#fff;border-radius:8px}.num-nav button.answered{background:#e9efff;border-color:#a9b8eb}.num-nav button.current{background:var(--accent);color:#fff}.wrong-list{display:grid;gap:12px}.wrong-item{padding:16px}.wrong-item h3{margin:0 0 5px;font-size:1rem}.bar-row{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin:12px 0}.source-list{display:grid;gap:10px}.source{padding:14px;border:1px solid var(--line);border-radius:12px}.source b{display:block}.qa-table{width:100%}.notice{border:1px solid #efdca0;background:#fff9e7;border-radius:13px;padding:14px}.backup-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.backup-box{padding:18px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:1000;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media print{.sidebar,.topbar,.bottom-nav,.q-actions,.filters,.btn{display:none!important}.app-main{margin:0!important;padding:0!important}.panel{box-shadow:none;border:0}.theory-card{break-inside:avoid}.theory-card .body{display:block!important}}

.q-actions>.btn{width:auto}}

:"https://www.ncs.go.kr/common/file/viewFile2.do?mgmtNo=34","use":"시간·예산·물적·인적자원 하위능력 확인"},{"title":"정보능력 학습자용 가이드북","publisher":"국가직무능력표준(NCS)","url":"https://www.ncs.go.kr/common/file/viewFile2.do?mgmtNo=40","use":"정보처리·컴퓨터활용·보안 확인"},{"title":"직업윤리 학습자용 가이드북","publisher":"국가직무능력표준(NCS)","url":"https://www.ncs.go.kr/common/file/viewFile2.do?mgmtNo=49","use":"근로윤리·공동체윤리 확인"},{"title":"공공기관 채용 필기 예시: 4지선다 50문항 60분","publisher":"ALIO","url":"https://www.alio.go.kr/download/download.json?fileNo=3064447","use":"대표적 시간압박 모의고사 기본값 참고(기관별 상이)"}],"research_notes":["피듈형은 NCS의 공식 분류명이 아니라 모듈 지식과 PSAT형 추론·자료해석이 섞인 시험을 가리키는 수험업계 표현이다.","기관별 공고·출제대행사에 따라 영역, 문항 수, 시험시간, 난도가 다르므로 특정 기관의 실제 출제를 보장하지 않는다.","사용자가 지정한 정보능력·자원관리능력은 기존 직업기초능력 명칭이다. 지원기관 공고에 이 명칭이 있으면 해당 공고를 우선한다.","공식 공개문항은 복제하거나 문구만 바꾸지 않고, 공식 하위능력과 공개 형식의 구조만 참고해 전 문항을 새로 작성했다.","문항 비율은 각 영역마다 모듈확인 20%, 업무상황 적용 50%, 자료·추론 30%로 설계했다."],"qa":{"status":"PASS","question_total":300,"domain_counts":{"COM":50,"PRO":50,"INF":50,"RES":50,"NUM":50,"ETH":50},"type_counts":{"COM/모듈확인":10,"COM/피듈적용":25,"COM/자료추론":15,"PRO/모듈확인":10,"PRO/피듈적용":25,"PRO/자료추론":15,"INF/모듈확인":10,"INF/피듈적용":25,"INF/자료추론":15,"RES/모듈확인":10,"RES/피듈적용":25,"RES/자료추론":15,"NUM/모듈확인":10,"NUM/피듈적용":25,"NUM/자료추론":15,"ETH/모듈확인":10,"ETH/피듈적용":25,"ETH/자료추론":15},"difficulty_counts":{"1":72,"2":120,"3":108},"answer_position_counts":{"2":85,"3":72,"0":68,"1":75},"mock_sizes":[50,50,50,50,50,50],"mock_domain_counts":[{"COM":9,"PRO":8,"INF":8,"RES":9,"NUM":8,"ETH":8},{"COM":8,"PRO":9,"INF":8,"RES":8,"NUM":9,"ETH":8},{"COM":8,"PRO":8,"INF":9,"RES":8,"NUM":8,"ETH":9},{"COM":9,"PRO":8,"INF":8,"RES":9,"NUM":8,"ETH":8},{"COM":8,"PRO":9,"INF":8,"RES":8,"NUM":9,"ETH":8},{"COM":8,"PRO":8,"INF":9,"RES":8,"NUM":8,"ETH":9}],"errors":[],"warnings":[],"manual_review":["각 영역에서 난도 1·2·3 문항을 표본 추출해 정답 근거와 오답 배타성을 확인한다.","수리·자원·문제해결 계산형은 생성식과 표시 정답을 역산한다.","윤리 문항은 무조건 신고/폭로가 아니라 긴급통제-사실확인-공식절차-기록의 실행가능성을 확인한다.","정보능력의 AI 항목은 최신 보완영역으로 명시하고 기존 공식 범위와 혼동하지 않는다.","모의고사 6세트의 영역 배분은 세트당 각 영역 8~9문항이며 문항 중복이 없다."]}}</script><script>
const DATA=JSON.parse(document.getElementById('app-data').textContent);
window.__INITIAL_STATE__=null;
const KEY='ncs_pidul_suite_v2_'+document.body.dataset.mode;
const DEFAULT={view:'dashboard',answers:{},drafts:{},bookmarks:[],theoryDone:[],filters:{domain:'ALL',type:'ALL',difficulty:'ALL',status:'ALL',search:''},bankPos:0,mockAttempts:{},activeMock:null,mockPos:0,created:new Date().toISOString()};
let state=loadState(), qStart=Date.now(), timerHandle=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function loadState(){try{const raw=localStorage.getItem(KEY);return Object.assign({},DEFAULT,window.__INITIAL_STATE__||{},raw?JSON.parse(raw):{});}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function qBy(id){return DATA.questions.find(q=>q.id===id)}
function domainStats(code){const qs=DATA.questions.filter(q=>q.domain===code), ans=qs.filter(q=>state.answers[q.id]), ok=ans.filter(q=>state.answers[q.id].correct);return {total:qs.length,done:ans.length,ok:ok.length,rate:ans.length?Math.round(ok.length/ans.length*100):0}}
function allStats(){const ans=Object.values(state.answers), ok=ans.filter(x=>x.correct).length;return {done:ans.length,ok,rate:ans.length?Math.round(ok/ans.length*100):0,theory:state.theoryDone.length}}
function setView(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function navState(){$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===state.view));}
function progress(done,total){return `<div class="progress"><i style="width:${total?done/total*100:0}%"></i></div>`}
function difficulty(d){return ['','기초','실전','고난도'][d]}
function render(){navState();const main=$('#main');if(state.view==='dashboard')main.innerHTML=renderDashboard();else if(state.view==='theory')main.innerHTML=renderTheory();else if(state.view==='bank')main.innerHTML=renderBank();else if(state.view==='mocks')main.innerHTML=renderMocks();else if(state.view==='wrong')main.innerHTML=renderWrong();else if(state.view==='analytics')main.innerHTML=renderAnalytics();else if(state.view==='sources')main.innerHTML=renderSources();else if(state.view==='backup')main.innerHTML=renderBackup();else if(state.view==='more')main.innerHTML=renderMore();else main.innerHTML=renderDashboard();setupTimer();}
function renderDashboard(){const s=allStats();return `<div class="section-head"><div><h2>NCS 피듈형 합격 학습실</h2><p>6개 영역의 공식 하위능력과 피듈형 상황·자료추론을 함께 훈련합니다.</p></div><span class="badge ok">문항 QA ${DATA.qa.status}</span></div><div class="notice"><b>냉정한 전제</b> 피듈형은 공식 분류명이 아니며 기관별 형식이 다릅니다. 지원 공고가 최우선입니다. 이 자료의 문제는 모두 창작문항이며 실제 출제를 보장하지 않습니다.</div><div class="grid stats" style="margin-top:16px"><div class="panel stat"><div class="num">${s.done}/300</div><div class="label">문제 풀이</div>${progress(s.done,300)}</div><div class="panel stat"><div class="num">${s.rate}%</div><div class="label">누적 정답률</div>${progress(s.rate,100)}</div><div class="panel stat"><div class="num">${s.theory}/36</div><div class="label">이론 완료</div>${progress(s.theory,36)}</div><div class="panel stat"><div class="num">${Object.values(state.mockAttempts).filter(x=>x.finished).length}/6</div><div class="label">실전 모의 완료</div>${progress(Object.values(state.mockAttempts).filter(x=>x.finished).length,6)}</div></div><div class="grid domain-grid" style="margin-top:16px">${DATA.domains.map(d=>{const x=domainStats(d.code);return `<div class="panel domain-card"><span class="badge">${d.code}</span><h3>${d.name}</h3><p>${d.desc}</p>${progress(x.done,x.total)}<div class="row"><span class="small muted">${x.done}/${x.total} · 정답률 ${x.rate}%</span><button class="btn" data-action="domainStart" data-domain="${d.code}">풀기</button></div></div>`}).join('')}</div><div class="panel panel-pad" style="margin-top:16px"><h3>권장 학습 순서</h3><p>① 이론에서 취약 개념 확인 → ② 문제은행에서 영역별 풀이 → ③ 오답의 복습코드 확인 → ④ 50문항 모의고사를 60분 제한으로 풀이 → ⑤ JSON 또는 진행상황 포함 HTML로 백업</p></div>`}
function renderTheory(){const cards=[];for(const d of DATA.domains){cards.push(`<h3 style="margin:22px 0 8px">${d.name}</h3>`);for(const t of DATA.theory[d.code]){const done=state.theoryDone.includes(t.code);cards.push(`<details id="${t.code}" class="theory-card ${done?'done':''}" ${location.hash==='#'+t.code?'open':''}><summary><span>${t.code} · ${t.title}</span><span class="badge ${done?'ok':''}">${done?'완료':'미완료'}</span></summary><div class="body"><p>${t.summary}</p><b>핵심</b><ul>${t.principles.map(x=>`<li>${x}</li>`).join('')}</ul><b>함정</b><ul>${t.traps.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn ${done?'':'primary'}" data-action="theoryToggle" data-code="${t.code}">${done?'완료 취소':'학습 완료'}</button></div></details>`)} }return `<div class="section-head"><div><h2>이론정리 36개</h2><p>오답 해설의 복습코드가 아래 장으로 연결됩니다.</p></div><button class="btn" data-action="printTheory">인쇄</button></div><div class="theory-list">${cards.join('')}</div>`}
function filtered(){let qs=DATA.questions.filter(q=>(state.filters.domain==='ALL'||q.domain===state.filters.domain)&&(state.filters.type==='ALL'||q.type===state.filters.type)&&(state.filters.difficulty==='ALL'||String(q.difficulty)===state.filters.difficulty));if(state.filters.status==='DONE')qs=qs.filter(q=>state.answers[q.id]);if(state.filters.status==='WRONG')qs=qs.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);if(state.filters.status==='NEW')qs=qs.filter(q=>!state.answers[q.id]);if(state.filters.status==='BOOK')qs=qs.filter(q=>state.bookmarks.includes(q.id));const s=state.filters.search.trim().toLowerCase();if(s)qs=qs.filter(q=>(q.id+' '+q.subskill+' '+q.stem.replace(/<[^>]+>/g,' ')).toLowerCase().includes(s));return qs}
function filtersHtml(){return `<div class="filters"><input id="search" value="${esc(state.filters.search)}" placeholder="문항·주제 검색"><select id="fDomain"><option value="ALL">전체 영역</option>${DATA.domains.map(d=>`<option value="${d.code}" ${state.filters.domain===d.code?'selected':''}>${d.name}</option>`).join('')}</select><select id="fType"><option value="ALL">전체 유형</option>${['모듈확인','피듈적용','자료추론'].map(x=>`<option ${state.filters.type===x?'selected':''}>${x}</option>`).join('')}</select><select id="fDiff"><option value="ALL">전체 난도</option>${[1,2,3].map(x=>`<option value="${x}" ${state.filters.difficulty==x?'selected':''}>${difficulty(x)}</option>`).join('')}</select><select id="fStatus"><option value="ALL">전체 상태</option><option value="NEW" ${state.filters.status==='NEW'?'selected':''}>미풀이</option><option value="DONE" ${state.filters.status==='DONE'?'selected':''}>풀이완료</option><option value="WRONG" ${state.filters.status==='WRONG'?'selected':''}>오답</option><option value="BOOK" ${state.filters.status==='BOOK'?'selected':''}>북마크</option></select></div>`}
function renderQuestion(q,mode='bank'){const saved=mode==='bank'?state.answers[q.id]:null,draft=mode==='bank'?state.drafts[q.id]:getMockDraft(q.id),revealed=!!saved;return `<div class="panel question-card"><div class="q-meta"><span class="badge">${q.id}</span><span class="badge">${q.domain_name}</span><span class="badge">${q.type}</span><span class="badge ${q.difficulty===3?'warn':''}">${difficulty(q.difficulty)}</span><span class="badge">권장 ${q.recommended_sec}초</span></div><div class="q-stem">${q.stem}</div><div class="options">${q.options.map((o,i)=>{let cls='';if(draft===i)cls+=' selected';if(revealed&&i===q.answer)cls+=' correct';if(revealed&&saved.selected===i&&!saved.correct)cls+=' wrong';return `<button class="option${cls}" data-action="${mode==='bank'?'choose':'mockChoose'}" data-qid="${q.id}" data-opt="${i}" ${revealed?'disabled':''}><span class="opt-no">${i+1}</span><span>${esc(o)}</span></button>`}).join('')}</div>${revealed?`<div class="feedback ${saved.correct?'ok':'bad'}"><h4>${saved.correct?'정답입니다.':'오답입니다.'}</h4><p><b>정답:</b> ${q.answer+1}번 ${esc(q.options[q.answer])}</p><p>${esc(q.explanation)}</p><p><b>자주 빠지는 함정:</b> ${esc(q.trap)}</p><p><b>다시 볼 이론:</b> <button class="btn" data-action="reviewCode" data-code="${q.review_code}">${q.review_code}</button></p></div>`:''}</div>`}
function renderBank(){const qs=filtered();if(state.bankPos>=qs.length)state.bankPos=Math.max(0,qs.length-1);const q=qs[state.bankPos];return `<div class="section-head"><div><h2>문제은행 300</h2><p>답을 선택한 뒤 제출해야 정답과 해설이 공개됩니다.</p></div><span class="badge">${qs.length}문항 검색됨</span></div>${filtersHtml()}${q?renderQuestion(q):'<div class="panel panel-pad">조건에 맞는 문항이 없습니다.</div>'}${q?`<div class="q-actions"><div class="group"><button class="btn" data-action="bankPrev" ${state.bankPos===0?'disabled':''}>← 이전</button><button class="btn" data-action="bookmark" data-qid="${q.id}">${state.bookmarks.includes(q.id)?'★ 북마크':'☆ 북마크'}</button></div><div class="group"><span class="badge">${state.bankPos+1}/${qs.length}</span>${!state.answers[q.id]?`<button class="btn primary" data-action="submit" data-qid="${q.id}" ${state.drafts[q.id]===undefined?'disabled':''}>정답 제출</button>`:''}<button class="btn" data-action="bankNext" ${state.bankPos>=qs.length-1?'disabled':''}>다음 →</button></div></div>`:''}`}
function renderMocks(){if(state.activeMock!==null)return renderActiveMock();return `<div class="section-head"><div><h2>실전 모의고사 6회</h2><p>각 50문항·60분. 300문항이 세트 간 중복 없이 한 번씩 배치됩니다.</p></div></div><div class="grid mock-grid">${DATA.mocks.map((m,i)=>{const a=state.mockAttempts[i]||{};return `<div class="panel mock-card"><span class="badge">제${i+1}회</span><h3>6영역 통합 50문항</h3><p class="muted small">영역별 8~9문항 · 즉시해설 없음</p><div class="score">${a.finished?a.score+'점':'미응시'}</div><button class="btn primary" data-action="mockStart" data-mock="${i}">${a.finished?'결과 다시 보기':a.startedAt?'이어 풀기':'시작'}</button></div>`}).join('')}</div>`}
function getAttempt(){return state.mockAttempts[state.activeMock]||{answers:{}}}function getMockDraft(id){return getAttempt().answers?.[id]}
function renderActiveMock(){const mi=state.activeMock,ids=DATA.mocks[mi],a=state.mockAttempts[mi]||{answers:{}};if(a.finished)return renderMockResult(mi,a);if(state.mockPos>=ids.length)state.mockPos=0;const q=qBy(ids[state.mockPos]);const elapsed=a.startedAt?Math.floor((Date.now()-a.startedAt)/1000)+(a.baseElapsed||0):0;const remain=Math.max(0,3600-elapsed);return `<div class="mock-toolbar"><span>제${mi+1}회 · ${state.mockPos+1}/50 · 답변 ${Object.keys(a.answers||{}).length}</span><span class="timer" id="timer" data-remain="${remain}">${fmtTime(remain)}</span></div>${renderQuestion(q,'mock')}<div class="q-actions"><div class="group"><button class="btn" data-action="mockExit">저장 후 나가기</button><button class="btn" data-action="mockPrev" ${state.mockPos===0?'disabled':''}>← 이전</button></div><div class="group"><button class="btn" data-action="mockNext" ${state.mockPos===49?'disabled':''}>다음 →</button><button class="btn primary" data-action="mockFinish">최종 제출</button></div></div><div class="num-nav">${ids.map((id,i)=>`<button class="${a.answers?.[id]!==undefined?'answered':''} ${i===state.mockPos?'current':''}" data-action="mockGo" data-pos="${i}">${i+1}</button>`).join('')}</div>`}
function renderMockResult(mi,a){const ids=DATA.mocks[mi], wrong=ids.filter(id=>a.answers[id]!==qBy(id).answer);return `<div class="section-head"><div><h2>제${mi+1}회 결과</h2><p>정답 ${50-wrong.length}/50 · ${a.score}점</p></div><button class="btn" data-action="mockExit">목록으로</button></div><div class="grid stats"><div class="panel stat"><div class="num">${a.score}</div><div class="label">환산점수</div></div><div class="panel stat"><div class="num">${wrong.length}</div><div class="label">오답</div></div><div class="panel stat"><div class="num">${fmtTime(a.elapsed||0)}</div><div class="label">소요시간</div></div><div class="panel stat"><div class="num">${Object.keys(a.answers||{}).length}/50</div><div class="label">응답</div></div></div><div class="panel panel-pad" style="margin-top:16px"><h3>오답 문항</h3><div class="wrong-list">${wrong.length?wrong.map(id=>{const q=qBy(id),sel=a.answers[id];return `<div class="wrong-item"><b>${id} · ${q.domain_name}</b><p>${q.stem.replace(/<[^>]+>/g,' ').slice(0,180)}</p><p><span class="badge bad">선택 ${sel===undefined?'미응답':sel+1}번</span> <span class="badge ok">정답 ${q.answer+1}번</span> <button class="btn" data-action="openQuestion" data-qid="${id}">해설 보기</button></p></div>`}).join(''):'<p>전 문항 정답입니다.</p>'}</div></div>`}
function finishMock(auto=false){const mi=state.activeMock,a=state.mockAttempts[mi];if(!a)return;const ids=DATA.mocks[mi],elapsed=Math.min(3600,Math.floor((Date.now()-a.startedAt)/1000)+(a.baseElapsed||0));let ok=0;for(const id of ids){if(a.answers?.[id]===qBy(id).answer)ok++}a.finished=true;a.elapsed=elapsed;a.score=Math.round(ok/50*100);for(const id of ids){const q=qBy(id),sel=a.answers?.[id];if(sel!==undefined)state.answers[id]={selected:sel,correct:sel===q.answer,elapsed:0,source:'mock'}}save();if(auto)toast('시간이 종료되어 자동 제출했습니다.');render()}
function renderWrong(){const wrong=DATA.questions.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);return `<div class="section-head"><div><h2>오답노트</h2><p>오답 ${wrong.length}문항. 복습코드로 이론을 다시 확인하세요.</p></div></div><div class="wrong-list">${wrong.length?wrong.map(q=>`<div class="panel wrong-item"><h3>${q.id} · ${q.domain_name} · ${q.subskill}</h3><p>${q.stem.replace(/<[^>]+>/g,' ').slice(0,220)}</p><p><span class="badge bad">내 답 ${state.answers[q.id].selected+1}번</span> <span class="badge ok">정답 ${q.answer+1}번</span> <span class="badge">${q.review_code}</span></p><button class="btn" data-action="openQuestion" data-qid="${q.id}">문제·해설 다시 보기</button></div>`).join(''):'<div class="panel panel-pad">아직 기록된 오답이 없습니다.</div>'}</div>`}
function renderAnalytics(){const rows=DATA.domains.map(d=>{const s=domainStats(d.code);return `<div class="bar-row"><b>${d.name.replace('능력','')}</b><div>${progress(s.rate,100)}</div><span>${s.rate}%</span></div>`}).join('');const typeRows=['모듈확인','피듈적용','자료추론'].map(t=>{const qs=DATA.questions.filter(q=>q.type===t&&state.answers[q.id]),ok=qs.filter(q=>state.answers[q.id].correct).length,rate=qs.length?Math.round(ok/qs.length*100):0;return `<div class="bar-row"><b>${t}</b><div>${progress(rate,100)}</div><span>${rate}%</span></div>`}).join('');return `<div class="section-head"><div><h2>학습분석</h2><p>풀이한 문항만 기준으로 계산합니다.</p></div></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="panel panel-pad"><h3>영역별 정답률</h3>${rows}</div><div class="panel panel-pad"><h3>유형별 정답률</h3>${typeRows}</div></div><div class="panel panel-pad" style="margin-top:16px"><h3>냉정한 판단 기준</h3><p>80% 이상: 유지 훈련 · 65~79%: 오답코드 복습 · 65% 미만: 이론 재학습 후 동일 하위능력 재풀이. 특정 기관 합격선은 반드시 공고를 확인하세요.</p></div>`}
function renderSources(){return `<div class="section-head"><div><h2>자료조사·출제설계·검수</h2><p>무엇을 근거로 만들었고 무엇을 보장하지 않는지 공개합니다.</p></div><span class="badge ${DATA.qa.status==='PASS'?'ok':'bad'}">자동검수 ${DATA.qa.status}</span></div><div class="panel panel-pad"><h3>분석 결론</h3><ul>${DATA.research_notes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel panel-pad" style="margin-top:16px"><h3>문항 구성</h3><table class="qa-table"><tr><th>영역</th><th>전체</th><th>모듈</th><th>상황적용</th><th>자료추론</th></tr>${DATA.domains.map(d=>`<tr><td>${d.name}</td><td>50</td><td>10</td><td>25</td><td>15</td></tr>`).join('')}</table><p class="small muted">난도 전체 분포: 기초 ${DATA.qa.difficulty_counts['1']} · 실전 ${DATA.qa.difficulty_counts['2']} · 고난도 ${DATA.qa.difficulty_counts['3']}</p></div><div class="panel panel-pad" style="margin-top:16px"><h3>검수 절차</h3><ol>${DATA.qa.manual_review.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><b>자동검사:</b> 문항수, 영역·유형 비율, ID·본문 중복, 4개 보기 중복, 정답 인덱스, 복습코드, 6회 모의 중복·누락.</p></div><div class="panel panel-pad" style="margin-top:16px"><h3>조사 출처</h3><div class="source-list">${DATA.sources.map(s=>`<div class="source"><b>${esc(s.title)}</b><span class="small muted">${esc(s.publisher)} · ${esc(s.use)}</span><br><a href="${s.url}" target="_blank" rel="noopener">원문 열기</a></div>`).join('')}</div></div>`}
function renderMore(){return `<div class="section-head"><div><h2>더보기</h2><p>오답·분석·근거·백업을 확인합니다.</p></div></div><div class="grid domain-grid"><button class="panel panel-pad btn" data-nav="wrong"><b>오답노트</b><br><span class="small muted">틀린 문항과 복습코드</span></button><button class="panel panel-pad btn" data-nav="analytics"><b>학습분석</b><br><span class="small muted">영역·유형별 정답률</span></button><button class="panel panel-pad btn" data-nav="sources"><b>자료·검수</b><br><span class="small muted">출처와 한계, QA</span></button><button class="panel panel-pad btn" data-nav="backup"><b>영구보관</b><br><span class="small muted">백업·복원·스냅샷</span></button>${document.body.dataset.pwa==='1'?'<button class="panel panel-pad btn primary" data-action="installPWA"><b>홈 화면에 설치</b><br><span class="small">브라우저가 지원할 때 사용</span></button>':''}</div>`}
function renderBackup(){return `<div class="section-head"><div><h2>영구보관·백업</h2><p>브라우저 자동저장에만 의존하지 말고 파일 백업을 병행하세요.</p></div></div><div class="notice"><b>영구보관의 의미</b> 이 HTML 자체는 인터넷 없이 열 수 있습니다. 다만 브라우저 데이터 삭제·기기변경 시 자동저장 기록은 사라질 수 있으므로 JSON 또는 진행상황 포함 HTML을 보관해야 합니다.</div><div class="grid backup-grid" style="margin-top:16px"><div class="panel backup-box"><h3>학습기록 JSON</h3><p>가장 가볍고 다른 버전으로 옮기기 쉽습니다.</p><button class="btn primary" data-action="exportJson">JSON 내보내기</button> <button class="btn" data-action="importJson">JSON 가져오기</button></div><div class="panel backup-box"><h3>진행상황 포함 HTML</h3><p>현재 기록을 HTML 파일 안에 넣어 새 파일로 저장합니다.</p><button class="btn primary" data-action="snapshot">HTML 저장</button></div><div class="panel backup-box"><h3>오답 텍스트</h3><p>오답 번호·정답·복습코드를 별도 파일로 저장합니다.</p><button class="btn" data-action="exportWrong">오답 TXT 저장</button></div><div class="panel backup-box"><h3>초기화</h3><p>현재 기기의 모든 답안·진도·모의고사 기록을 삭제합니다.</p><button class="btn danger" data-action="reset">전체 초기화</button></div></div><input id="importFile" type="file" accept="application/json" class="hidden">`}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setupTimer(){clearInterval(timerHandle);if(state.activeMock===null)return;const a=state.mockAttempts[state.activeMock];if(!a||a.finished)return;timerHandle=setInterval(()=>{const el=$('#timer');if(!el)return;let r=Number(el.dataset.remain)-1;el.dataset.remain=r;el.textContent=fmtTime(r);if(r<=0){clearInterval(timerHandle);finishMock(true)}},1000)}
function updateFilters(){state.filters.domain=$('#fDomain')?.value||'ALL';state.filters.type=$('#fType')?.value||'ALL';state.filters.difficulty=$('#fDiff')?.value||'ALL';state.filters.status=$('#fStatus')?.value||'ALL';state.filters.search=$('#search')?.value||'';state.bankPos=0;save();render()}
function openQuestion(id){const q=qBy(id);state.filters={domain:q.domain,type:'ALL',difficulty:'ALL',status:'ALL',search:id};state.bankPos=0;state.view='bank';save();render()}
document.addEventListener('change',e=>{if(['fDomain','fType','fDiff','fStatus'].includes(e.target.id))updateFilters();if(e.target.id==='importFile'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=Object.assign({},DEFAULT,x);save();render();toast('복원했습니다.')}catch{alert('올바른 백업 JSON이 아닙니다.')}};r.readAsText(e.target.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='search'){clearTimeout(window._searchT);window._searchT=setTimeout(updateFilters,250)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-nav]');if(!b)return;if(b.dataset.nav){setView(b.dataset.nav);return}const a=b.dataset.action;
 if(a==='domainStart'){state.filters={domain:b.dataset.domain,type:'ALL',difficulty:'ALL',status:'NEW',search:''};state.bankPos=0;setView('bank')}
 if(a==='choose'){state.drafts[b.dataset.qid]=Number(b.dataset.opt);qStart=Date.now();save();render()}
 if(a==='submit'){const q=qBy(b.dataset.qid),sel=state.drafts[q.id];if(sel===undefined)return;state.answers[q.id]={selected:sel,correct:sel===q.answer,elapsed:Math.round((Date.now()-qStart)/1000),source:'bank'};save();render()}
 if(a==='bankPrev'){state.bankPos=Math.max(0,state.bankPos-1);qStart=Date.now();save();render()}
 if(a==='bankNext'){state.bankPos=Math.min(filtered().length-1,state.bankPos+1);qStart=Date.now();save();render()}
 if(a==='bookmark'){const id=b.dataset.qid;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();render()}
 if(a==='theoryToggle'){const c=b.dataset.code;state.theoryDone=state.theoryDone.includes(c)?state.theoryDone.filter(x=>x!==c):[...state.theoryDone,c];save();render()}
 if(a==='reviewCode'){state.view='theory';location.hash='#'+b.dataset.code;save();render();setTimeout(()=>document.getElementById(b.dataset.code)?.scrollIntoView(),100)}
 if(a==='printTheory')window.print();
 if(a==='mockStart'){const i=Number(b.dataset.mock),old=state.mockAttempts[i];if(old?.finished){state.activeMock=i;state.mockPos=0}else{state.mockAttempts[i]=old||{answers:{},startedAt:Date.now(),baseElapsed:0,finished:false};if(!state.mockAttempts[i].startedAt)state.mockAttempts[i].startedAt=Date.now();state.activeMock=i;state.mockPos=0}save();render()}
 if(a==='mockChoose'){const at=getAttempt();at.answers=at.answers||{};at.answers[b.dataset.qid]=Number(b.dataset.opt);state.mockAttempts[state.activeMock]=at;save();render()}
 if(a==='mockPrev'){state.mockPos=Math.max(0,state.mockPos-1);save();render()}
 if(a==='mockNext'){state.mockPos=Math.min(49,state.mockPos+1);save();render()}
 if(a==='mockGo'){state.mockPos=Number(b.dataset.pos);save();render()}
 if(a==='mockExit'){if(state.activeMock!==null){const at=state.mockAttempts[state.activeMock];if(at&&!at.finished&&at.startedAt){at.baseElapsed=(at.baseElapsed||0)+Math.floor((Date.now()-at.startedAt)/1000);at.startedAt=null}}state.activeMock=null;save();render()}
 if(a==='mockFinish'){if(confirm('모의고사를 최종 제출할까요? 제출 후 채점됩니다.'))finishMock(false)}
 if(a==='openQuestion')openQuestion(b.dataset.qid);
 if(a==='exportJson')download('NCS_피듈형_학습기록.json',JSON.stringify(state,null,2),'application/json');
 if(a==='importJson')$('#importFile').click();
 if(a==='snapshot'){const marker='window.__INITIAL_STATE__=null;',replacement='window.__INITIAL_STATE__='+JSON.stringify(state).replace(/<\/script/gi,'<\\/script')+';';const out='<!doctype html>\n'+document.documentElement.outerHTML.replace(marker,replacement);download('NCS_피듈형_진행상황포함.html',out,'text/html');}
 if(a==='exportWrong'){const qs=DATA.questions.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);const text=qs.map(q=>`${q.id}\t${q.domain_name}\t정답 ${q.answer+1}번\t복습 ${q.review_code}\t${q.explanation}`).join('\n');download('NCS_피듈형_오답노트.txt',text||'오답 없음');}
 if(a==='reset'){if(confirm('모든 학습기록을 삭제할까요?')){localStorage.removeItem(KEY);state=structuredClone(DEFAULT);render();}}
});
render();
</script><script>
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action="installPWA"]');if(!b)return;if(!deferredInstall){alert('설치 메뉴가 아직 표시되지 않습니다. HTTPS 주소 또는 localhost에서 열고 브라우저 메뉴의 “홈 화면에 추가”를 확인하세요.');return}deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));}
</script></body></html>
